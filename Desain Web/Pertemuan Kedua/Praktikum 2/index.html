<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <title>Kartu Profil - Praktikum 2</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { display: flex; justify-content: center; align-items: center; min-height: 100vh; background-color: #e2e8f0; }
        
        .card {
            /* px digunakan untuk border presisi */
            border: 2px solid #cbd5e1; 
            /* % digunakan agar kartu responsif terhadap parent/layar */
            width: 80%; 
            max-width: 350px;
            /* rem digunakan untuk padding agar ukurannya proporsional dengan root font-size */
            padding: 2rem; 
            background: white;
            border-radius: 12px;
            text-align: center;
        }
        .card img { width: 100px; height: 100px; border-radius: 50%; margin-bottom: 1rem; }
        .card h2 { font-size: 1.5rem; color: #334155; }
        .card p { font-size: 1rem; color: #64748b; margin-top: 0.5rem; }
    </style>
</head>
<body>
    <div class="card">
        <img src="https://via.placeholder.com/100" alt="Foto Profil">
        <h2>Budi Santoso</h2>
        <p>Web Developer antusias yang suka mengeksplorasi CSS dan layout interaktif.</p>
    </div>
</body>
</html>
